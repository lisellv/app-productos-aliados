# =====================================================================
# NIVEL 2 · Base de datos + backend
# ---------------------------------------------------------------------
# Reutiliza el nivel 1 (include) y agrega el backend Spring Boot.
# Pruebas con Postman, curl o Swagger UI: http://localhost:8080/swagger-ui.html
# El frontend puede seguir corriendo local con `npm run dev` (proxy a :8080).
#
#   docker compose -f nivel2-db-backend.yml up -d --build
#   docker compose -f nivel2-db-backend.yml logs -f backend
#
# Requisito: Dockerfile y .dockerignore de docker/backend copiados
# en la raíz del repositorio del backend (ver README).
# =====================================================================
name: kit2

include:
  - nivel1-db.yml

services:
  backend:
    build:
      context: ${BACKEND_DIR:-../ServicesBackend}
    image: kit2/backend:1.0
    environment:
      # Spring convierte SPRING_DATASOURCE_URL → spring.datasource.url
      # Dentro de la red de Docker la base se llama "db", no "localhost"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-servicetechdb}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      # Ajusta el nombre según la propiedad de tu proyecto (jwt.secret → JWT_SECRET)
      JWT_SECRET: ${JWT_SECRET:-cambia-esta-clave-por-una-de-al-menos-32-caracteres-xyz}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy   # espera a que PostgreSQL acepte conexiones
    restart: unless-stopped
