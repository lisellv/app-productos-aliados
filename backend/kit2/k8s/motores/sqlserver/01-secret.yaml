# SQL Server · credenciales (reemplaza a nivel2/01-secret.yaml)
# La clave de "sa" debe ser segura: 8+ caracteres con mayúsculas, minúsculas,
# números y símbolos. Si no, SQL Server se apaga al arrancar.
apiVersion: v1
kind: Secret
metadata:
  name: kit2-secret
  namespace: kit2
type: Opaque
stringData:
  DB_USER: sa
  DB_PASSWORD: Kit2_Clave_Segura
  JWT_SECRET: cambia-esta-clave-por-una-de-al-menos-32-caracteres-xyz
