# MySQL · credenciales (reemplaza a nivel2/01-secret.yaml)
# stringData permite escribirlas en texto plano; Kubernetes las guarda en base64.
# En un proyecto real NO se suben a git.
apiVersion: v1
kind: Secret
metadata:
  name: kit2-secret
  namespace: kit2
type: Opaque
stringData:
  DB_ROOT_PASSWORD: root     # clave del administrador "root" de MySQL
  DB_USER: app               # usuario que usa el backend
  DB_PASSWORD: app
  JWT_SECRET: cambia-esta-clave-por-una-de-al-menos-32-caracteres-xyz
