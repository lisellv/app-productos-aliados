# MySQL · configuración no sensible (reemplaza a nivel2/02-configmap.yaml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: kit2-config
  namespace: kit2
data:
  DB_NAME: servicetechdb
  # Puerto que espera el initContainer del backend antes de arrancar
  DB_PORT: "3306"
  # "db" es el nombre del Service de MySQL (10-db.yaml)
  SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/servicetechdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
