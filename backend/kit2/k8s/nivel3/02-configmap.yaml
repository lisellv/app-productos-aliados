# Configuración no sensible, equivalente a las variables del docker compose
apiVersion: v1
kind: ConfigMap
metadata:
  name: kit2-config
  namespace: kit2
data:
  DB_NAME: servicetechdb
  # Puerto que espera el initContainer del backend antes de arrancar
  DB_PORT: "5432"
  # "db" es el nombre del Service de PostgreSQL (10-db.yaml)
  SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/servicetechdb
