# Credenciales. stringData permite escribirlas en texto plano;
# Kubernetes las guarda en base64. En un proyecto real NO se suben a git.
apiVersion: v1
kind: Secret
metadata:
  name: kit2-secret
  namespace: kit2
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASSWORD: postgres
  JWT_SECRET: cambia-esta-clave-por-una-de-al-menos-32-caracteres-xyz
