spring.application.name=app-productos-aliados-back-end

#DATABASE
#spring.datasource.url=jdbc:postgresql://localhost:5432/alianzas?socketTimeout=15
#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.datasource.username=postgres
#spring.datasource.password=admin

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app_productos_aliados_local?socketTimeout=15}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
jwt.secret=${JWT_SECRET}
server.port=${PORT:8080}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:[*];http://127.0.0.1:[*];https://app-productos-aliados-frontend.onrender.com}


spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.minimum-idle=1

spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=validate

#Migration configuration
spring.flyway.enabled=true
spring.flyway.baseline-version=0
spring.flyway.schemas=public
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-suffixes=.sql
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
