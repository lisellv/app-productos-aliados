# ============================================================
#  docker-compose.yml — backend + base de datos, construido en tu notebook
#  Va en la RAÍZ del repositorio del backend.
#
#  Uso:
#    docker compose up --build        levanta todo (Ctrl+C para detener)
#    docker compose up --build -d     lo mismo, en segundo plano
#    docker compose logs -f backend   ver los mensajes del backend
#    docker compose down              bajar todo (los datos quedan)
#    docker compose down -v           bajar todo y BORRAR los datos
#
#  Probar:  http://localhost:8080/actuator/health   → {"status":"UP"}
#           http://localhost:8080/docs              → Swagger
# ============================================================
name: bd-postgres16

services:

  # ------------------------------------------------------------------
  # La base de datos
  # ------------------------------------------------------------------
  db:
    image: postgres:16-alpine            # motor:versión (alpine = imagen liviana)
    environment:
      POSTGRES_DB: app_productos_aliados_local         # base que se crea al primer arranque
      POSTGRES_USER: postgres            # usuario administrador
      POSTGRES_PASSWORD: admin        # su clave (solo para practicar)


    ports:
      - "5432:5432"                      # "puerto de tu PC : puerto del contenedor"
    volumes:
      # Volumen con nombre: aquí viven los datos. Sobrevive a "down".
      - datos:/var/lib/postgresql/data
      # Scripts .sql que se ejecutan SOLO la primera vez (volumen vacío)
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:                         # cómo sabe Docker que la base ya responde
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_productos_aliados_local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  # ------------------------------------------------------------------
  # Tu backend Spring Boot (imagen publicada en GitHub)
  # La imagen se define en el archivo .env (BACKEND_IMAGE).
  # Para construirla desde tu código agrega: -f backend-local.yml
  # ------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-imagen-backend:latest}
    environment:
      # Spring convierte SPRING_DATASOURCE_URL en spring.datasource.url
      # Dentro de Docker la base se llama "db" (el nombre del servicio)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/app_productos_aliados_local
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET before starting Docker Compose}
    ports:
      - "${BACKEND_PORT:-8084}:8080"      # evita chocar con un backend local en 8080
    depends_on:
      db:
        condition: service_healthy       # espera a que la base acepte conexiones
    restart: unless-stopped

# Volúmenes con nombre que usa este archivo. Docker los crea solo.
volumes:
  datos:
