# Valida el backend, construye su imagen y la publica en ghcr.io
name: Backend - pruebas y publicación

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch: # permite ejecutarlo manualmente desde GitHub

jobs:
  imagen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # permiso para publicar en ghcr.io
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/*.gradle.kts

      - name: Ejecutar pruebas del backend
        working-directory: backend
        run: chmod +x gradlew && ./gradlew test --no-daemon
        env:
          JWT_SECRET: dGVzdC1vbmx5LW5vbi1wcm9kdWN0aW9uLWtleS1mb3ItY2ktdmFsaWRhdGlvbi0yMDI2

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir el nombre de la imagen
        id: imagen
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.imagen.outputs.name }}:latest
            ${{ steps.imagen.outputs.name }}:${{ github.sha }}
