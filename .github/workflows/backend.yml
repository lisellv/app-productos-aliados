# Construye la imagen del backend y la publica en ghcr.io
name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch: # permite ejecutarlo a mano desde GitHub

jobs:
  imagen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # permiso para publicar en ghcr.io
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen (en minúsculas)
        id: imagen
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.imagen.outputs.name }}:latest
            ${{ steps.imagen.outputs.name }}:${{ github.sha }}
