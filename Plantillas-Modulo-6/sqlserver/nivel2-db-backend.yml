# NIVEL 2 · Base de datos + backend
# Uso:  docker compose -f nivel2-db-backend.yml up -d --build
# En tu PC corres: frontend (opcional)
include:
  - nivel1-db.yml            # trae los servicios "db" y "db-init" del nivel 1

services:
  backend:
    build: ./backend         # carpeta donde está el Dockerfile del backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=NOMBRE_BD;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "Clave.Segura123"
    depends_on:
      db-init:
        condition: service_completed_successfully   # espera a que la base exista
