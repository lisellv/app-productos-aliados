<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Financia .PE | Carrito</title>
	<link rel="stylesheet" href="css/styles.css">
	<script src="scripts/header.js" defer></script>
	<script src="scripts/footer.js" defer></script>
</head>
<body>
	<div class="page">
		<div id="header"></div>

		<main class="shopping-wrap">
			<h1 class="cart-title">Carrito de compras</h1>

			<div class="cart-panel">
				<div class="cart-item">

					<div class="product-box">
						<div class="product-thumb">
							<img src="img/categories/react.jpg" alt="Camión de carga 10 TN" />
						</div>
						<div class="product-meta">
							<div class="product-name">Camión de carga 10 TN</div>
							<div class="product-row">
								<span class="price">S/ 85,000.00</span>
								<div class="quantity" aria-label="Cantidad">
									<button type="button">−</button>
									<input type="number" value="1" min="1" />
									<button type="button">+</button>
								</div>
							</div>
						</div>
					</div>

					<button class="delete-btn" aria-label="Eliminar">🗑</button>
				</div>
 				<div class="total-row">
					<span>Total</span>
					<span>S/ 85,000.00</span>
				</div>
				<a href="thanks.html" class="confirm-btn">Confirmar Orden</a>
			</div>
		</main>
		<div id="footer"></div>
	</div>
</body>
</html>
