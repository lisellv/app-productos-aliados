<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Financia Minegocio.PE | Bandeja de solicitudes</title>
	<link rel="stylesheet" href="css/styles.css">
	<script src="scripts/header.js" defer></script>
	<script src="scripts/config.js" defer></script>
	<script src="scripts/api.js" defer></script>
	<script src="scripts/solicitudes.js" defer></script>
	<script src="scripts/footer.js" defer></script>
</head>
<body>
	<div id="header"></div>
	<main class="requests-page">
		<div class="requests-heading">
			<div>
				<h1>Bandeja de solicitudes</h1>
				<p id="requestsScope">Cargando solicitudes...</p>
			</div>
			<a class="requests-new-link" href="categories.html">Nueva solicitud</a>
		</div>
		<p class="requests-message" id="requestsMessage" role="status"></p>
		<div class="requests-table-wrap">
			<table class="requests-table">
				<thead>
					<tr>
						<th>Solicitud</th>
						<th>Cliente</th>
						<th>Producto</th>
						<th>Monto</th>
						<th>Plazo</th>
						<th>Precalificación</th>
						<th>Estado</th>
						<th>Fecha</th>
					</tr>
				</thead>
				<tbody id="requestsBody">
					<tr><td colspan="8">Cargando solicitudes...</td></tr>
				</tbody>
			</table>
		</div>
	</main>
	<div id="footer"></div>
</body>
</html>
